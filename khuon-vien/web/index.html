<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Khuôn viên KMA 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap&subset=vietnamese">
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
/* Layout: drawing-sheet — large viewer as the "sheet", a narrow title-block column on the right (stacks under on phones) */
:root {
  --bg: #eef1f4;
  --sheet: #ffffff;
  --ink: #1d2630;
  --muted: #5d6a77;
  --line: #d3dae1;
  --accent: #3f6f96;
  --accent-ink: #ffffff;
  --stage-top: #c9d6e2;
  --stage-bottom: #eef0ef;
  --chip: #e4e9ee;
  --f-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141a20; --sheet: #1c242c; --ink: #e3e9ee; --muted: #9aa8b5; --line: #2e3a45;
    --accent: #7fb0d8; --accent-ink: #0f1820; --stage-top: #2a3a4a; --stage-bottom: #1a2129; --chip: #26313b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141a20; --sheet: #1c242c; --ink: #e3e9ee; --muted: #9aa8b5; --line: #2e3a45;
  --accent: #7fb0d8; --accent-ink: #0f1820; --stage-top: #2a3a4a; --stage-bottom: #1a2129; --chip: #26313b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.wrap { max-width: 1280px; margin: 0 auto; display: grid; gap: 16px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 20px; }
h1 { font: 700 clamp(28px, 4vw, 40px)/1 var(--f-display); letter-spacing: .01em; margin: 0; text-wrap: balance; }
h1 small { font-weight: 500; color: var(--muted); font-size: .55em; letter-spacing: .06em; text-transform: uppercase; margin-left: 10px; }
.sub { color: var(--muted); margin: 0; font-size: 14px; }
.grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
@media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } }

.stage { position: relative; background: var(--sheet); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
model-viewer {
  width: 100%; height: min(72vh, 680px); min-height: 380px; display: block;
  background: linear-gradient(var(--stage-top), var(--stage-bottom));
  --poster-color: transparent;
}
.models { border-top: 0; padding: 0; }
.views { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px; border-top: 1px solid var(--line); }
.views button, .tog {
  font: 500 13px/1 var(--f-body); color: var(--ink); background: var(--chip);
  border: 1px solid transparent; border-radius: 4px; padding: 8px 11px; cursor: pointer;
}
.views button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.views button:focus-visible, .tog:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hint {
  position: absolute; left: 12px; top: 12px; font: 12px/1.4 var(--f-mono); color: var(--muted);
  background: color-mix(in srgb, var(--sheet) 82%, transparent); padding: 6px 8px; border-radius: 4px; pointer-events: none;
}
.loading[hidden] { display: none; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; font: 500 14px var(--f-mono); color: var(--muted); pointer-events: none; }

aside { background: var(--sheet); border: 1px solid var(--line); border-radius: 6px; display: grid; }
aside section { padding: 14px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; min-width: 0; }
aside section:last-child { border-bottom: 0; }
.label { font: 600 12px/1 var(--f-display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; }
dt { color: var(--muted); font-size: 13px; }
dd { margin: 0; text-align: right; white-space: nowrap; font: 500 13px var(--f-mono); font-variant-numeric: tabular-nums; }
.row { display: flex; align-items: center; gap: 10px; }
.row input[type="range"] { flex: 1; min-width: 0; accent-color: var(--accent); }
.row output { font: 12px var(--f-mono); width: 3.2em; text-align: right; color: var(--muted); }
.swatches { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; font-size: 13px; }
.sw { display: flex; align-items: center; gap: 8px; min-width: 0; }
.sw i { width: 14px; height: 14px; border-radius: 2px; flex: none; border: 1px solid var(--line); }
.toggles { display: flex; flex-wrap: wrap; gap: 6px; }
.tog[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.note { font-size: 13px; color: var(--muted); margin: 0; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
[hidden] { display: none !important; }
body { margin: 0; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1 id="ttl">TA1 <small>Học viện Kỹ thuật Mật mã · bản thử 3D</small></h1>
    <p class="sub">Model dựng bằng code + Blender, có texture · dùng cho game Unity góc nhìn thứ 3</p>
  </header>

  <div class="models views" role="group" aria-label="Chọn model" id="models">
    <button type="button" data-model="ta1" aria-pressed="true">TA1</button>
    <button type="button" data-model="tb2" aria-pressed="false">TB2 · Thư viện</button>
    <button type="button" data-model="hd" aria-pressed="false">HĐ + Hội trường</button>
    <button type="button" data-model="nha_an" aria-pressed="false">Nhà ăn hệ quân</button>
    <button type="button" data-model="ta23" aria-pressed="false">TA2 + TA3</button>
    <button type="button" data-model="canteen" aria-pressed="false">Canteen + tennis</button>
    <button type="button" data-model="ta4" aria-pressed="false">TA4 (TB5)</button>
    <button type="button" data-model="sports" aria-pressed="false">Khu thể thao</button>
    <button type="button" data-model="gate" aria-pressed="false">Cổng, tường, bồn nước</button>
    <button type="button" data-model="all" aria-pressed="false">Toàn bộ (đúng vị trí)</button>
  </div>

  <div class="grid">
    <div class="stage">
      <model-viewer id="mv" src="../export/TA1.glb" alt="Model 3D"
        camera-controls touch-action="none" shadow-intensity="1" shadow-softness="0.8"
        exposure="0.8" environment-image="neutral" tone-mapping="aces" interaction-prompt="none"
        camera-orbit="135deg 78deg 100m" field-of-view="35deg"
        min-camera-orbit="auto 0deg 2m" max-camera-orbit="auto 180deg 600m"
        interpolation-decay="120">
        <div class="loading" slot="progress-bar" id="loading">Đang tải model…</div>
      </model-viewer>
      <div class="hint">Kéo: xoay · Cuộn/chụm: zoom · Chuột phải/2 ngón: dịch</div>
      <div class="views" role="group" aria-label="Góc nhìn" id="views"></div>
    </div>

    <aside>
      <section>
        <span class="label">Thông số</span>
        <dl id="stats"></dl>
      </section>
      <section>
        <span class="label">Ánh sáng</span>
        <div class="row">
          <label for="exp" class="note" style="min-width:4.5em">Độ sáng</label>
          <input id="exp" type="range" min="0.3" max="1.6" step="0.05" value="0.8">
          <output id="expOut">0.80</output>
        </div>
        <div class="row">
          <label for="sun" class="note" style="min-width:4.5em">Bóng đổ</label>
          <input id="sun" type="range" min="0" max="2" step="0.1" value="1">
          <output id="sunOut">1.0</output>
        </div>
        <div class="toggles">
          <button type="button" class="tog" id="rot" aria-pressed="false">Tự xoay</button>
          <button type="button" class="tog" id="env" aria-pressed="false">Ánh sáng ngoài trời</button>
        </div>
      </section>
      <section>
        <span class="label">Vật liệu</span>
        <div class="swatches" id="swatches"></div>
      </section>
      <section>
        <span class="label">Thử gì</span>
        <p class="note" id="tips"></p>
      </section>
    </aside>
  </div>
</div>

      tips: "Bấm \u201cNhà bảo vệ\u201d để xem khối mái bằng, mái kính, barie; \u201cTường bao\u201d để xem tường chạy quanh khuôn viên.",
      views: [["Toàn cảnh cổng", "20deg 78deg 45m", "auto 3m auto"], ["Từ ngoài đường", "0deg 88deg 30m", "0m 3m 0m", "50deg"],
              ["Nhà bảo vệ", "150deg 86deg 18m", "-9m 2m -4m", "55deg"], ["Bồn nước", "170deg 70deg 14m", "4.3m 0.5m -22.9m", "50deg"],
              ["Tường bao", "200deg 30deg 320m", "10m 0m -100m"]]
    },
    all: {
      title: "Toàn bộ đã dựng", src: "../export/campus_all.glb", size: "21,9 MB",
      stats: [["Gồm", "8 toà, cổng + tường, bồn nước, tennis, khu thể thao"], ["Vị trí", "Theo mặt bằng B1"], ["Gốc toạ độ", "Tâm cổng chính"], ["File web", "GLB 21,9 MB"]],
      swatches: [["#97a2ad", "TA1"], ["#e6d6ae", "TB2 kem"], ["#5b4b45", "TB2 đế nâu"], ["#e3d3a8", "HĐ kem"], ["#6f7377", "HĐ khung xám"], ["#9e3b32", "Nhà ăn mái đỏ"], ["#6e6a64", "TA3 lam"], ["#ecd77a", "Canteen vàng"]],
      tips: "Bấm \u201cTrên cao\u201d để xem bố cục cả khuôn viên đã dựng; \u201cTrước cổng nhìn vào\u201d để xem từ cổng chính.",
      views: [["Toàn cảnh", "200deg 65deg 300m", "auto auto auto"], ["Trước cổng nhìn vào", "0deg 98deg 45m", "4.3m 8m -30m", "65deg"],
              ["Từ sân nhìn ra cổng", "180deg 96deg 40m", "4.3m 6m 0m", "65deg"], ["Trên cao", "20deg 25deg 320m", "auto auto auto"]]
    }
  };
  const mv = document.getElementById("mv");
  const viewsEl = document.getElementById("views");
  const loading = document.getElementById("loading");

  function setView(btn) {
    viewsEl.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === btn)));
    mv.cameraTarget = btn.dataset.target;
    mv.cameraOrbit = btn.dataset.orbit;
    mv.fieldOfView = btn.dataset.fov || "35deg";
  }

  function show(key) {
    const m = MODELS[key];
    document.querySelectorAll("#models button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.model === key)));
    document.getElementById("ttl").firstChild.nodeValue = m.title + " ";
    document.getElementById("stats").innerHTML = m.stats.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
    document.getElementById("swatches").innerHTML = m.swatches.map(([c, t]) => `<span class="sw"><i style="background:${c}"></i>${t}</span>`).join("");
    document.getElementById("tips").textContent = m.tips;
    viewsEl.innerHTML = "";
    m.views.forEach(([name, orbit, target, fov], i) => {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = name;
      b.dataset.orbit = orbit; b.dataset.target = target; if (fov) b.dataset.fov = fov;
      b.setAttribute("aria-pressed", String(i === 0));
      b.addEventListener("click", () => setView(b));
      viewsEl.appendChild(b);
    });
    loading.hidden = false; loading.textContent = `Đang tải model (${m.size})…`;
    mv.src = m.src;
    const first = viewsEl.querySelector("button");
    mv.cameraTarget = first.dataset.target; mv.cameraOrbit = first.dataset.orbit; mv.fieldOfView = "35deg";
    mv.jumpCameraToGoal && mv.jumpCameraToGoal();
  }
  document.querySelectorAll("#models button").forEach(b => b.addEventListener("click", () => show(b.dataset.model)));

  const exp = document.getElementById("exp"), expOut = document.getElementById("expOut");
  exp.addEventListener("input", () => { mv.exposure = exp.value; expOut.textContent = Number(exp.value).toFixed(2); });
  const sun = document.getElementById("sun"), sunOut = document.getElementById("sunOut");
  sun.addEventListener("input", () => { mv.shadowIntensity = sun.value; sunOut.textContent = Number(sun.value).toFixed(1); });
  const rot = document.getElementById("rot");
  rot.addEventListener("click", () => {
    const on = rot.getAttribute("aria-pressed") !== "true";
    rot.setAttribute("aria-pressed", String(on)); mv.autoRotate = on;
  });
  const env = document.getElementById("env");
  env.addEventListener("click", () => {
    const on = env.getAttribute("aria-pressed") !== "true";
    env.setAttribute("aria-pressed", String(on)); mv.environmentImage = on ? "legacy" : "neutral";
  });
  mv.addEventListener("load", () => { loading.hidden = true; });
  mv.addEventListener("error", () => { loading.hidden = false; loading.textContent = "Không tải được model. Thử tải lại trang."; });
  show("ta1");
})();
</script>
</body>
